{% extends "base.html" %}
{% block content %}
<style>
    .page-header {
        background: linear-gradient(135deg, var(--primary), var(--primary-xdark));
        border-radius: 12px;
        padding: 1.5rem 2rem;
        color: #fff;
        margin-bottom: 1.5rem;
        box-shadow: 0 4px 24px rgba(0, 0, 0, .18);
    }

    .heatmap-center {
        max-width: 680px;
        margin: 0 auto;
    }

    .heatmap-grid {
        display: grid;
        grid-template-columns: repeat(10, 1fr);
        gap: 5px;
    }

    .hm-cell {
        aspect-ratio: 1;
        border-radius: 8px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: transform .15s, box-shadow .15s;
    }

    .hm-cell:hover {
        transform: scale(1.12);
        box-shadow: 0 4px 14px rgba(0, 0, 0, .18);
        z-index: 2;
    }

    .hm-dez {
        font-size: .72rem;
        font-weight: 900;
        line-height: 1;
    }

    .hm-pct {
        font-size: .5rem;
        font-weight: 600;
        opacity: .8;
        line-height: 1;
        margin-top: 2px;
    }

    .heat-legend {
        display: flex;
        gap: 4px;
        align-items: center;
        justify-content: center;
        margin-top: .5rem;
        font-size: .7rem;
        color: #888;
    }

    .heat-swatch {
        width: 18px;
        height: 10px;
        border-radius: 3px;
    }

    .stat-pills {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: center;
        margin-bottom: 1rem;
    }

    .stat-pill {
        background: #fff;
        border-radius: 10px;
        padding: .45rem 1rem;
        box-shadow: 0 2px 8px rgba(0, 0, 0, .07);
        border: 1.5px solid #f8d0d0;
        font-size: .78rem;
    }

    .stat-pill strong {
        color: var(--primary);
    }

    .tab-btns {
        display: flex;
        gap: 6px;
        margin-bottom: 1rem;
        justify-content: center;
        flex-wrap: wrap;
    }

    .tab-btn-a {
        padding: .35rem .9rem;
        border-radius: 20px;
        font-size: .78rem;
        font-weight: 700;
        border: 2px solid transparent;
        cursor: pointer;
        background: #e8e8e8;
        color: #555;
        transition: all .15s;
    }

    .tab-btn-a.active {
        background: var(--primary);
        color: #fff;
    }

    .tab-btn-a.s1.active {
        background: var(--accent);
    }

    .tab-btn-a.s2.active {
        background: var(--accent2);
    }

    .rank-dez {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        font-weight: 800;
        font-size: .8rem;
    }

    .legend-s1 {
        color: var(--accent);
        font-weight: 700;
    }

    .legend-s2 {
        color: var(--accent2);
        font-weight: 700;
    }
</style>

<div class="page-header">
    <h2><i class="fas fa-crosshairs me-2"></i>Análise Estatística — Dupla Sena</h2>
    <p class="mb-0" style="opacity:.85;font-size:.9rem;">Heatmap 5×10 · Frequência combinada (1º+2º sorteio) e por
        sorteio individual</p>
</div>

<div class="stat-pills" id="statPills">
    <div class="stat-pill"><i class="fas fa-spinner fa-spin me-1"></i>Carregando...</div>
</div>

<div class="tab-btns">
    <button class="tab-btn-a active" id="tabFreq" onclick="setTab('freq')"><i class="fas fa-fire me-1"></i>Freq
        Combinada</button>
    <button class="tab-btn-a s1" id="tabFreq1" onclick="setTab('freq1')"><span class="legend-s1">●</span> 1º
        Sorteio</button>
    <button class="tab-btn-a s2" id="tabFreq2" onclick="setTab('freq2')"><span class="legend-s2">●</span> 2º
        Sorteio</button>
    <button class="tab-btn-a" id="tabAtr" onclick="setTab('atr')"><i class="fas fa-clock me-1"></i>Atraso</button>
    <button class="tab-btn-a" id="tabRank" onclick="setTab('rank')"><i class="fas fa-list-ol me-1"></i>Ranking</button>
</div>

<div class="heatmap-center" id="heatmapWrap">
    <div class="card border-0 shadow-sm mb-3">
        <div class="card-body p-3">
            <div class="heatmap-grid" id="heatmapGrid">
                <div class="text-center text-muted py-4" style="grid-column:1/-1;"><i
                        class="fas fa-spinner fa-spin me-2"></i>Calculando...</div>
            </div>
            <div class="heat-legend mt-2" id="heatLegend"></div>
        </div>
    </div>
</div>

<div class="card border-0 shadow-sm" id="rankWrap" style="display:none;max-width:680px;margin:0 auto;">
    <div class="card-header fw-bold"
        style="background:linear-gradient(135deg,var(--primary),var(--primary-xdark));color:#fff;"><i
            class="fas fa-list-ol me-2"></i>Ranking de Dezenas</div>
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover mb-0" style="font-size:.79rem;">
                <thead class="table-dark">
                    <tr>
                        <th>#</th>
                        <th>Dez</th>
                        <th>Freq Total</th>
                        <th>1ºS</th>
                        <th>2ºS</th>
                        <th>%</th>
                        <th>Atraso</th>
                    </tr>
                </thead>
                <tbody id="rankBody"></tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
    let _dados = [], _tabAtual = 'freq';

    function setTab(tab) {
        _tabAtual = tab;
        document.querySelectorAll('.tab-btn-a').forEach(b => b.classList.remove('active'));
        document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.add('active');
        const hw = document.getElementById('heatmapWrap'), rw = document.getElementById('rankWrap');
        if (tab === 'rank') { hw.style.display = 'none'; rw.style.display = 'block'; renderRank(); }
        else { hw.style.display = 'block'; rw.style.display = 'none'; renderHeatmap(tab); }
    }

    function heatColor(n, tab) {
        // Combinado e 1º sorteio → vermelho; 2º sorteio → laranja-vermelho
        let cold, hot;
        if (tab === 'freq2') { cold = [255, 235, 220]; hot = [232, 85, 0]; }
        else { cold = [255, 220, 220]; hot = [139, 0, 0]; }
        return `rgb(${Math.round(cold[0] + (hot[0] - cold[0]) * n)},${Math.round(cold[1] + (hot[1] - cold[1]) * n)},${Math.round(cold[2] + (hot[2] - cold[2]) * n)})`;
    }
    function textColor(n) { return n > 0.55 ? '#fff' : '#3d0000'; }

    function getVal(d, tab) {
        if (tab === 'freq') return d.freq; if (tab === 'freq1') return d.freq1; if (tab === 'freq2') return d.freq2; return d.atraso;
    }

    function renderHeatmap(tab) {
        const grid = document.getElementById('heatmapGrid'), legend = document.getElementById('heatLegend');
        if (!_dados.length) return;
        const vals = _dados.map(d => getVal(d, tab));
        const mn = Math.min(...vals), mx = Math.max(...vals);
        const norm = v => mx === mn ? 0.5 : (v - mn) / (mx - mn);
        let html = '';
        _dados.forEach(d => {
            const v = getVal(d, tab), n = norm(v), bg = heatColor(n, tab), tc = textColor(n);
            const lbl = tab === 'atr' ? d.atraso + 'c' : v + '×';
            html += `<div class="hm-cell" style="background:${bg};" title="${d.dezena_fmt}: ${tab === 'atr' ? 'atraso ' + d.atraso : 'freq ' + v}"><span class="hm-dez" style="color:${tc};">${d.dezena_fmt}</span><span class="hm-pct" style="color:${tc};">${lbl}</span></div>`;
        });
        grid.innerHTML = html;
        const gradFrom = tab === 'freq2' ? 'rgb(255,235,220)' : 'rgb(255,220,220)';
        const gradTo = tab === 'freq2' ? 'rgb(232,85,0)' : 'rgb(139,0,0)';
        const lbl1 = tab === 'atr' ? 'Mais atrasado' : 'Menos freq.', lbl2 = tab === 'atr' ? 'Menos atrasado' : 'Mais freq.';
        legend.innerHTML = `<div class="heat-swatch" style="background:${gradFrom};border:1px solid #ddd;"></div><span>${lbl1}</span><div style="flex:1;max-width:80px;height:10px;border-radius:3px;background:linear-gradient(to right,${gradFrom},${gradTo});"></div><span>${lbl2}</span><div class="heat-swatch" style="background:${gradTo};"></div>`;
    }

    function renderRank() {
        const tbody = document.getElementById('rankBody');
        if (!_dados.length) return;
        const sorted = [..._dados].sort((a, b) => _tabAtual === 'atr' ? b.atraso - a.atraso : b.freq - a.freq);
        const max = _tabAtual === 'atr' ? sorted[0].atraso : sorted[0].freq;
        tbody.innerHTML = sorted.map((d, i) => {
            const n = max > 0 ? d.freq / max : 0, bg = heatColor(n, 'freq'), tc = textColor(n);
            return `<tr><td class="fw-bold text-muted" style="font-size:.75rem;">${i + 1}º</td><td><span class="rank-dez" style="background:${bg};color:${tc};">${d.dezena_fmt}</span></td><td class="fw-bold">${d.freq}</td><td style="color:var(--accent);">${d.freq1}</td><td style="color:var(--accent2);">${d.freq2}</td><td>${d.pct}%</td><td class="text-muted">${d.atraso}</td></tr>`;
        }).join('');
    }

    async function carregar() {
        try {
            const r = await fetch('/analise/api/dados'); const d = await r.json();
            if (d.status !== 'success') { document.getElementById('heatmapGrid').innerHTML = '<div class="text-danger p-3" style="grid-column:1/-1;">Sincronize os dados primeiro.</div>'; return; }
            _dados = d.dados;
            document.getElementById('statPills').innerHTML = `
            <div class="stat-pill">🎴 <strong>${d.total_sorteios.toLocaleString()}</strong> concursos</div>
            <div class="stat-pill">🎯 <strong>${(d.total_draws || d.total_sorteios * 2).toLocaleString()}</strong> sorteios totais</div>
            <div class="stat-pill">📍 Até #<strong>${d.ultimo_concurso}</strong></div>
            <div class="stat-pill">📊 Esperado: <strong>${d.esperado_pct}%</strong></div>`;
            renderHeatmap('freq');
        } catch (e) { document.getElementById('heatmapGrid').innerHTML = `<div class="text-danger p-3" style="grid-column:1/-1;">Erro: ${e.message}</div>`; }
    }
    document.addEventListener('DOMContentLoaded', () => {
        carregar().then(() => {
            const h = (location.hash || '').replace(/^#/, '');
            if (h === 'sorteio2') setTab('freq2');
        });
    });
</script>
{% endblock %}
