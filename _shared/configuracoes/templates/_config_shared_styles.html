{# Estilos compartilhados — theme: 'dark' (central) ou 'light' (modalidade) #}
{% set is_dark = theme|default('light') == 'dark' %}
<style>
.cfg-section { margin-bottom: 1.25rem; }
.cfg-section-title {
    font-size: .8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px;
    margin-bottom: .65rem; padding-bottom: .35rem; border-bottom: 2px solid;
    {% if is_dark %}color: #94a3b8; border-color: #334155;{% else %}color: #666; border-color: rgba(0,0,0,.08);{% endif %}
}
.cfg-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: .65rem; }
.cfg-mini-card {
    border-radius: 8px; padding: .75rem; border: 1px solid;
    {% if is_dark %}background: #1e293b; border-color: #334155;{% else %}background: #f8f9fa; border-color: #eaeaea;{% endif %}
}
.cfg-mini-label { font-size: .68rem; text-transform: uppercase; letter-spacing: .4px; opacity: .75; font-weight: 600; }
.cfg-mini-val { font-size: 1rem; font-weight: 800; margin-top: .15rem; }
.cfg-table-sm { font-size: .82rem; width: 100%; }
.cfg-table-sm th, .cfg-table-sm td { padding: .4rem .5rem; vertical-align: middle; }
.cfg-table-sm thead th {
    font-size: .7rem; text-transform: uppercase; letter-spacing: .4px;
    {% if is_dark %}background: #0f172a; color: #94a3b8;{% else %}background: #eee; color: #555;{% endif %}
}
.cfg-pills .nav-link { font-size: .8rem; font-weight: 600; padding: .45rem .85rem; border-radius: 8px; }
.cfg-api-badge { font-size: .7rem; padding: .2rem .5rem; border-radius: 6px; }
.cfg-api-ok { background: rgba(34,197,94,.15); color: #16a34a; }
.cfg-api-off { background: rgba(239,68,68,.12); color: #dc2626; }
.cfg-desc { font-size: .88rem; line-height: 1.45; opacity: .9; }
.cfg-list li { margin-bottom: .25rem; font-size: .85rem; }
</style>
