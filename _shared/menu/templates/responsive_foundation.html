{# Camada estrutural de responsividade — Mobile First.
   Incluída no <head> de todas as modalidades. Não altera regras de negócio. #}
<style id="responsive-foundation">
    /* —— Base fluida —— */
    html {
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
        /* Conteúdo que chega depois (tabelas, listas) não empurra a janela. */
        overflow-anchor: none;
    }

    body {
        min-width: 0;
        padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    body:has(#mobilePanel.open) {
        overflow: hidden;
    }

    img,
    video {
        max-width: 100%;
        height: auto;
    }

    .page-content,
    .container,
    .container-fluid,
    .row,
    [class*="col-"] {
        min-width: 0;
    }

    .page-content {
        width: 100%;
        max-width: min(87.5rem, 100%);
        padding-inline: clamp(0.5rem, 2.5vw, 1.5rem);
        padding-block: clamp(0.75rem, 1.5vw, 1.5rem);
        overflow-x: clip;
    }

    @media (min-width: 1600px) {
        .page-content { max-width: 92rem; }
    }

    @media (min-width: 1920px) {
        .page-content { max-width: 100rem; }
    }

    @media (min-width: 2560px) {
        .page-content { max-width: 112rem; }
    }

    /* —— Navbar: hamburger até tablet; desktop a partir de 1200px —— */
    nav.navbar-main {
        min-width: 0;
        width: 100%;
        max-width: 100%;
        padding: 0 max(0.5rem, env(safe-area-inset-right, 0px));
        padding-left: max(0.5rem, env(safe-area-inset-left, 0px));
        gap: 0.35rem;
    }

    a.nav-brand {
        flex: 1 1 0;
        min-width: 0;
        max-width: none;
    }

    .nav-brand-text {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .nav-brand-text small {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        max-width: 100%;
    }

    .nav-toggler {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 2.75rem;
        min-height: 2.75rem;
        flex-shrink: 0;
        margin-left: 0;
    }

    .nav-gear-isolated {
        min-width: 2.75rem;
        min-height: 2.75rem;
        justify-content: center;
        margin-left: auto;
        flex-shrink: 0;
    }

    .nav-mobile-panel {
        height: calc(100dvh - var(--nav-h));
        max-height: calc(100dvh - var(--nav-h));
        padding-bottom: max(1rem, env(safe-area-inset-bottom, 0px));
        -webkit-overflow-scrolling: touch;
        overscroll-behavior: contain;
    }

    .mobile-link {
        min-height: 2.75rem;
    }

    /* Mobile / tablet: esconde itens desktop (o 900px original deixa overflow em retrato). */
    @media (max-width: 1199.98px) {
        .navbar-main .nav-items {
            display: none;
        }

        .navbar-main .nav-sep {
            display: none;
        }

        .navbar-main .nav-toggler {
            display: inline-flex;
        }
    }

    @media (min-width: 1200px) {
        .navbar-main {
            padding-left: max(1.25rem, env(safe-area-inset-left, 0px));
            padding-right: max(1.25rem, env(safe-area-inset-right, 0px));
            gap: 1rem;
        }

        a.nav-brand {
            flex: 0 0 auto;
        }

        .navbar-main .nav-toggler {
            display: none;
        }

        .nav-mobile-panel,
        .nav-mobile-panel.open {
            display: none !important;
        }
    }

    @media (max-width: 575.98px) {
        .nav-brand-text small {
            display: none;
        }

        .nav-brand-text {
            font-size: 0.82rem;
        }
    }

    @media (max-width: 340px) {
        .nav-brand-icon {
            width: 2rem;
            height: 2rem;
            font-size: 1rem;
        }
    }

    /* Celular em paisagem: barra mais baixa, painel usável. */
    @media (orientation: landscape) and (max-height: 500px) {
        :root {
            --nav-h: 3rem;
        }

        .navbar-main {
            height: var(--nav-h);
        }

        body {
            padding-top: var(--nav-h);
        }

        .nav-brand-text small {
            display: none;
        }

        .nav-mobile-panel {
            top: var(--nav-h);
            height: calc(100dvh - var(--nav-h));
            max-height: calc(100dvh - var(--nav-h));
            padding-block: 0.5rem;
        }

        .mobile-link {
            padding-block: 0.45rem;
            margin-bottom: 0.1rem;
        }
    }

    /* —— Toque e formulários em telas estreitas —— */
    @media (max-width: 767.98px) {
        .btn,
        .form-control,
        .form-select,
        .form-check-input {
            min-height: 2.75rem;
        }

        .btn-sm,
        .btn-group-sm > .btn {
            min-height: 2.5rem;
            padding-inline: 0.75rem;
        }

        input:not([type="checkbox"]):not([type="radio"]):not([type="range"]):not([type="hidden"]),
        select,
        textarea {
            font-size: 1rem;
            max-width: 100%;
        }

        .form-check-input {
            width: 1.25rem;
            height: 1.25rem;
        }
    }

    /* —— Tabelas: rolagem vertical com o título das colunas fixo —— */
    .table-responsive,
    .tabela-scroll {
        max-width: 100%;
        max-height: 70vh;
        overflow: auto;
        -webkit-overflow-scrolling: touch;
    }
    .table-responsive > table,
    .tabela-scroll > table {
        border-collapse: separate;
        border-spacing: 0;
        margin-bottom: 0;
    }
    .table-responsive thead th,
    .tabela-scroll thead th,
    .ai-pan-table-wrap thead th,
    .ai-jogos-table-wrap thead th,
    .cc-table-wrap thead th {
        position: sticky;
        top: 0;
        z-index: 2;
        background-color: var(--bs-table-bg, var(--surface, #fff));
        background-clip: padding-box;
        box-shadow: inset 0 -1px 0 rgba(0, 0, 0, .12);
    }

    /* —— Modais e dropdowns —— */
    .modal-dialog {
        max-width: min(var(--bs-modal-width, 31.25rem), calc(100vw - 1rem));
        margin-inline: 0.5rem;
    }

    @media (min-width: 576px) {
        .modal-dialog {
            margin-inline: auto;
        }
    }

    .dropdown-menu {
        max-width: min(calc(100vw - 1rem), 24rem);
    }

    /* O painel fica 8px abaixo do botão. Sem esta ponte, o mouse
       sai do item, o :hover acaba e o menu fecha antes do clique. */
    .navbar-main .nav-item-wrap::after {
        content: "";
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        height: 10px;
        z-index: 1;
    }

    .navbar-main .nav-item-wrap > .nav-dropdown {
        transform: none;
        max-height: calc(100dvh - var(--nav-h) - 1rem);
        overflow-x: hidden;
        overflow-y: auto;
        overscroll-behavior: contain;
        z-index: 2000;
    }

    .navbar-main .nav-item-wrap.open > .nav-dropdown,
    .navbar-main .nav-item-wrap:focus-within > .nav-dropdown {
        opacity: 1;
        visibility: visible;
        transform: none;
    }

    .navbar-main .nav-item-wrap.open > .nav-btn .caret,
    .navbar-main .nav-item-wrap:focus-within > .nav-btn .caret {
        transform: rotate(180deg);
    }

    .navbar-main .nav-item-wrap.nav-dd-right > .nav-dropdown {
        left: auto;
        right: 0;
    }

    /* —— Foco visível —— */
    :focus-visible {
        outline: 2px solid var(--accent, currentColor);
        outline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
        .navbar-main,
        .nav-dropdown,
        .nav-btn,
        .dd-link,
        .mobile-link {
            transition: none;
        }
    }

    .dd-link.dd-ge-destaque,
    .mobile-link.dd-ge-destaque {
        background: #fcf9e8;
        box-shadow: inset 3px 0 0 #d4b31a;
    }
    .dd-link.dd-ge-destaque-2,
    .mobile-link.dd-ge-destaque-2 {
        background: #f8f3dc;
        box-shadow: inset 3px 0 0 #c4a116;
    }
    .dd-link.dd-ge-destaque-3,
    .mobile-link.dd-ge-destaque-3 {
        background: #f4eed0;
        box-shadow: inset 3px 0 0 #b08918;
    }
    .dd-link.dd-ge-destaque-4,
    .mobile-link.dd-ge-destaque-4 {
        background: #efe4c0;
        box-shadow: inset 3px 0 0 #9a7414;
    }
    .dd-link.dd-ge-destaque-5,
    .mobile-link.dd-ge-destaque-5 {
        background: #ead9a8;
        box-shadow: inset 3px 0 0 #7d5e10;
    }
    .dd-link.dd-ge-destaque .dd-title {
        font-weight: 800;
    }
    .dd-link.dd-ge-sep,
    .mobile-link.dd-ge-sep {
        margin-top: .45rem;
        border-top: 1px solid #eee;
    }
    .dd-ge-rank {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 1.05rem;
        height: 1.05rem;
        padding: 0 .2rem;
        border-radius: 999px;
        background: #d4b31a;
        color: #171303;
        font-size: .65rem;
        font-weight: 800;
        margin-right: .35rem;
        line-height: 1;
    }

    /* —— Homes das modalidades (.page-header / .stat-card / .sync-card) —— */
    .page-content .page-header {
        min-width: 0;
        padding: clamp(1rem, 2.8vw, 1.5rem) clamp(0.85rem, 3vw, 2rem);
    }

    .page-content .page-header > .d-flex {
        min-width: 0;
    }

    .page-content .page-header h2 {
        font-size: clamp(1.15rem, 4vw, 1.75rem);
        line-height: 1.25;
        overflow-wrap: anywhere;
    }

    .page-content .page-header > .d-flex > div {
        min-width: 0;
    }

    .page-content .stat-card {
        min-width: 0;
        padding: clamp(0.7rem, 2vw, 1.2rem) clamp(0.45rem, 2vw, 1.5rem);
    }

    .page-content .stat-card .sc-val {
        font-size: clamp(1.15rem, 3.6vw, 1.8rem);
        overflow-wrap: anywhere;
    }

    .page-content .stat-card .sc-lbl {
        font-size: clamp(0.62rem, 1.7vw, 0.75rem);

        overflow-wrap: anywhere;

    .page-content .sync-card {

    }

    .page-content .sync-card a.btn,
    .page-content .sync-card .btn {

    .page-content .ultimo-draw-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 0.5rem 1rem;
        align-items: center;
        justify-items: center;
        width: 100%;
        max-width: 100%;

    }

    .page-content .ultimo-draw-row > .fw-bold {

        white-space: normal !important;
    }

    @media (min-width: 768px) {
        .page-content .ultimo-draw-row {
            grid-template-columns: minmax(7.5rem, 12.2rem) minmax(0, 1fr);
            justify-items: stretch;
            gap: 2rem;
        }

        .page-content .ultimo-draw-row > .fw-bold {
            text-align: right !important;
        }

        .page-content .ultimo-draw-row--extra {

        }
    }

    .page-content .draw-dezenas-wrap,
    .page-content .premiacao-wrap {
        max-width: 100%;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
    }

    .page-content .hero-grid {

        grid-template-columns: 1fr;

        min-width: 0;
    }

    .page-content .tip-card {
        min-width: 0;

    }

    .page-content .stat-num {
        font-size: clamp(1.25rem, 4vw, 2rem);
        overflow-wrap: anywhere;
    }

    .page-content .stat-label {
        overflow-wrap: anywhere;
        white-space: normal;
        line-height: 1.25;
    }

    .page-content .mecaica-badge {
        white-space: normal;
    }

    .page-content .route-card {
        min-width: 0;
    }

    @media (min-width: 768px) {
        .page-content .hero-grid {
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 1.5rem;
        }

        .page-content .tip-card {
            min-width: 16.25rem;
            max-width: 19.375rem;

        }

    @media (max-width: 575.98px) {
        .page-content .page-header > .d-flex {

            align-items: flex-start !important;
        }

        .page-content .page-header .ms-auto {

        .page-content .sync-card .row > .col-6 {

    /* —— Telas internas: abas, barras, tabelas, heatmaps —— */
    .page-content .page-hdr {
        min-width: 0;
        padding: clamp(1rem, 2.8vw, 1.25rem) clamp(0.85rem, 3vw, 1.5rem);
    }

    .page-content .nav-tabs,
    .page-content .nav-pills {
        flex-wrap: wrap;
        row-gap: 0.25rem;
    }

    .page-content .nav-tabs .nav-link,
    .page-content .nav-pills .nav-link {

    }

    .page-content .card-header {
        flex-wrap: wrap;
        gap: 0.4rem;

    }

    .page-content .heatmap-center {

    }

    .page-content .heatmap-grid {

    .page-content .conf-tab-container {
        -webkit-overflow-scrolling: touch;

    }

    .page-content .conf-tab-btn {

        flex-shrink: 0;
    }

    .page-content .conv-upload-zone {

    }

    .page-content .conv-input-concurso {
        max-width: 100%;
        width: min(8.75rem, 100%);
    }

    .page-content .auto-wrap {
        max-width: 100%;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
    }

    .page-content .pos-excel-block .pos-panels-wrap {
        max-width: 100%;
        -webkit-overflow-scrolling: touch;
    }

    @media (max-width: 767.98px) {
        .page-content .btn-group {
            flex-wrap: wrap;
            max-width: 100%;
        }

        .page-content .comp-bar .comp-field,
        .page-content .comp-bar .comp-field-sm {
            flex: 1 1 100%;
            min-width: 0;
            max-width: none;
        }

    /* Cópia embutida no Comparador: mesma largura da tela original. */
    body.is-embed .page-content {
        max-width: none;
        width: 100%;
        padding: 0;
        overflow: visible;
    }
    body.is-embed .container-fluid {
        padding-left: 0;
        padding-right: 0;
    }
    body.is-embed .table-responsive,
    body.is-embed .tabela-scroll {
        max-height: var(--cmp-table-max, 70vh);

    table.tabela-ordenavel thead th.ordem-col {
        cursor: pointer;
        user-select: none;

        margin-left: .2rem;
        opacity: .7;

    table.tabela-ordenavel thead th.ordem-asc .ordem-ind,
    table.tabela-ordenavel thead th.ordem-desc .ordem-ind { opacity: 1; }
</style>
<script>
/* Abertura: a janela fica no topo. Rolagem interna de tabela continua livre. */
(function () {
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';

  var focar = HTMLElement.prototype.focus;
  HTMLElement.prototype.focus = function (options) {
    var role = this.getAttribute && this.getAttribute('role');
    if (role === 'tab') {
      var opts = (options && typeof options === 'object') ? Object.assign({}, options) : {};
      opts.preventScroll = true;
      return focar.call(this, opts);
    }
    return focar.apply(this, arguments);
  };

  var usuarioRolou = false;
  function marcar() { usuarioRolou = true; }
  window.addEventListener('wheel', marcar, { passive: true, capture: true });
  window.addEventListener('touchmove', marcar, { passive: true, capture: true });
  window.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp' || e.key === 'PageDown' || e.key === 'PageUp' || e.key === 'Home' || e.key === 'End' || e.key === ' ') marcar();
  }, true);

  function atalhoPediuTrecho() {
    if (location.hash) return true;
    try {
      var q = new URLSearchParams(location.search);
      return q.has('modo') || q.has('desdob') || q.has('aba') || q.has('viz') || q.has('padrao') || q.has('tab');
    } catch (e) { return false; }
  }

  var limite = Date.now() + 4000;
  var nosso = false;
  function voltarAoTopo() {
    if (usuarioRolou || atalhoPediuTrecho() || Date.now() > limite) return;
    if (window.scrollY <= 0) return;
    nosso = true;
    window.scrollTo(0, 0);
  }
  window.addEventListener('scroll', function () {
    if (nosso) { nosso = false; return; }
    voltarAoTopo();
  }, { passive: true });
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', voltarAoTopo);
  else voltarAoTopo();
  window.addEventListener('load', voltarAoTopo);
  window.addEventListener('pageshow', function (e) {
    if (e.persisted) return;
    var nav = performance.getEntriesByType && performance.getEntriesByType('navigation')[0];
    if (nav && nav.type === 'back_forward') return;
    voltarAoTopo();
  });
})();
</script>
<script>
(function () {
  var DENTRO = '.table-responsive, .tabela-scroll, .ai-pan-table-wrap, .ai-jogos-table-wrap, .cc-table-wrap, nav, .navbar-main';
  function ancestralRola(el) {
    var n = el.parentElement;
    while (n && n !== document.body) {
      var cs = getComputedStyle(n);
      var rola = cs.overflowY === 'auto' || cs.overflowY === 'scroll';
      if (rola && cs.maxHeight && cs.maxHeight !== 'none') return true;
      n = n.parentElement;
    }
    return false;
  }
  function preparar(table) {
    if (!table || table.tagName !== 'TABLE' || table.dataset.scrollWrap) return;
    if (!table.tHead || !table.tHead.rows.length) return;
    if (table.closest(DENTRO)) {
      table.dataset.scrollWrap = '1';
      return;
    }
    if (ancestralRola(table)) {
      table.dataset.scrollWrap = '1';
      return;
    }
    var pai = table.parentNode;
    if (!pai) return;
    table.dataset.scrollWrap = '1';
    var wrap = document.createElement('div');
    wrap.className = 'table-responsive tabela-scroll';
    pai.insertBefore(wrap, table);
    wrap.appendChild(table);
  }
  function varrer(raiz) {
    if (!raiz || raiz.nodeType !== 1) return;
    if (raiz.tagName === 'TABLE') preparar(raiz);
    if (raiz.querySelectorAll) raiz.querySelectorAll('table').forEach(preparar);
  }
  function iniciar() {
    varrer(document.body);
    var obs = new MutationObserver(function (muts) {
      muts.forEach(function (m) {
        m.addedNodes.forEach(function (node) {
          if (node.nodeType === 1) varrer(node);
        });
      });
    });
    obs.observe(document.body, { childList: true, subtree: true });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', iniciar);
  else iniciar();
})();
</script>
<script>
/* Ordenação pelo título. Número, data e dinheiro começam pelo maior. Texto, de A a Z. */
(function () {
  function texto(td) {
    return (td && td.textContent ? td.textContent : '').replace(/\s+/g, ' ').trim();
  }
  function valor(txt) {
    var s = String(txt || '').replace(/\u00a0/g, ' ').trim();
    if (!s || s === '—' || s === '-' || s === '–') return { t: 'vazio', v: '' };
    var dm = s.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
    if (dm) return { t: 'num', v: Number(dm[3] + dm[2] + dm[1]) };
    var limpo = s.replace(/R\$\s*/i, '').replace(/%/g, '').replace(/\s/g, '').replace(/º$/,'');
    if (/^-?\d{1,3}(\.\d{3})*(,\d+)?$/.test(limpo) || /^-?\d+(,\d+)?$/.test(limpo)) {
      var n = Number(limpo.replace(/\./g, '').replace(',', '.'));
      if (isFinite(n)) return { t: 'num', v: n };
    }
    return { t: 'txt', v: s.toLowerCase() };
  }
  function tipoColuna(blocos, idx) {
    var num = 0, txt = 0, i;
    for (i = 0; i < blocos.length && i < 12; i++) {
      var v = valor(texto(blocos[i][0].children[idx]));
      if (v.t === 'vazio') continue;
      if (v.t === 'num') num++; else txt++;
    }
    return num >= txt ? 'num' : 'txt';
  }
  function blocosDe(tbody) {
    var rows = Array.prototype.slice.call(tbody.rows);
    var out = [];
    var i;
    for (i = 0; i < rows.length; i++) {
      var pack = [rows[i]];
      var nxt = rows[i + 1];
      if (nxt && nxt.querySelector('td[colspan]')) {
        pack.push(nxt);
        i++;
      }
      out.push(pack);
    }
    return out;
  }
  function preparar(table) {
    if (!table || !table.tHead) return;
    var ths = Array.prototype.slice.call(table.tHead.rows[0].cells);
    var tem = ths.some(function (th) { return th.querySelector('.ordem-ind'); });
    if (!tem) {
      delete table.dataset.ordemCol;
      delete table.dataset.ordemDir;
    }
    ths.forEach(function (th, i) {
      if (th.dataset.ordem === 'nao') return;
      th.classList.add('ordem-col');
      if (!th.querySelector('.ordem-ind')) {
        var ind = document.createElement('span');
        ind.className = 'ordem-ind';
        ind.textContent = ' ⇅';
        th.appendChild(ind);
      }
    });
  }
  document.addEventListener('click', function (ev) {
    if (ev.target.closest('button, a, input, select, label')) return;
    var th = ev.target.closest('table.tabela-ordenavel thead th');
    if (!th || th.dataset.ordem === 'nao') return;
    var table = th.closest('table');
    var idx = Array.prototype.indexOf.call(th.parentElement.children, th);
    if (idx < 0) return;
    var tbody = table.tBodies[0];
    if (!tbody) return;
    var blocos = blocosDe(tbody);
    if (blocos.length < 2) return;
    var tipo = th.dataset.tipo || tipoColuna(blocos, idx);
    var prev = table.dataset.ordemCol;
    var dir = prev === String(idx)
      ? (table.dataset.ordemDir === 'asc' ? 'desc' : 'asc')
      : (tipo === 'num' ? 'desc' : 'asc');
    var mult = dir === 'asc' ? 1 : -1;
    blocos.sort(function (a, b) {
      var va = valor(texto(a[0].children[idx]));
      var vb = valor(texto(b[0].children[idx]));
      if (va.t === 'vazio' && vb.t !== 'vazio') return 1;
      if (vb.t === 'vazio' && va.t !== 'vazio') return -1;
      if (va.t === 'num' && vb.t === 'num') return (va.v - vb.v) * mult;
      return String(va.v).localeCompare(String(vb.v), 'pt-BR', { numeric: true }) * mult;
    });
    var frag = document.createDocumentFragment();
    blocos.forEach(function (pack) { pack.forEach(function (tr) { frag.appendChild(tr); }); });
    tbody.appendChild(frag);
    table.dataset.ordemCol = String(idx);
    table.dataset.ordemDir = dir;
    Array.prototype.forEach.call(th.parentElement.children, function (h, i) {
      h.classList.toggle('ordem-asc', i === idx && dir === 'asc');
      h.classList.toggle('ordem-desc', i === idx && dir === 'desc');
      var ind = h.querySelector('.ordem-ind');
      if (ind) ind.textContent = i === idx ? (dir === 'asc' ? ' ▲' : ' ▼') : ' ⇅';
    });
  });
  function achar(node) {
    if (!node || node.nodeType !== 1) return;
    if (node.matches && node.matches('table.tabela-ordenavel')) preparar(node);
    if (node.closest) {
      var dona = node.closest('table.tabela-ordenavel');
      if (dona) preparar(dona);
    }
    if (node.querySelectorAll) node.querySelectorAll('table.tabela-ordenavel').forEach(preparar);
  }
  function iniciar() {
    document.querySelectorAll('table.tabela-ordenavel').forEach(preparar);
    var obs = new MutationObserver(function (muts) {
      muts.forEach(function (m) {
        achar(m.target);
        m.addedNodes.forEach(achar);
      });
    });
    obs.observe(document.body, { childList: true, subtree: true });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', iniciar);
  else iniciar();
})();
</script>
<script>
/* Menu: o clique deixa o painel aberto até escolher o item ou clicar fora.
   No celular, fechar o painel no mesmo instante do clique cancelava a ida à página. */
(function () {
  function fecharDesktop(exceto) {
    document.querySelectorAll('.nav-item-wrap.open').forEach(function (el) {
      if (el !== exceto) el.classList.remove('open');
    });
  }

  function alinhar(wrap) {
    var dd = wrap.querySelector(':scope > .nav-dropdown');
    if (!dd) return;
    wrap.classList.remove('nav-dd-right');
    var caixa = dd.getBoundingClientRect();
    if (caixa.right > window.innerWidth - 8) wrap.classList.add('nav-dd-right');
  }

  document.addEventListener('click', function (e) {
    var btn = e.target.closest('.navbar-main .nav-item-wrap > button.nav-btn');
    if (btn) {
      e.preventDefault();
      var wrap = btn.parentElement;
      var abrir = !wrap.classList.contains('open');
      fecharDesktop(null);
      if (abrir) {
        wrap.classList.add('open');
        alinhar(wrap);
      } else {
        btn.blur();
      }
      return;
    }

    var item = e.target.closest('.nav-dropdown a');
    if (item) {
      fecharDesktop(null);
      setTimeout(function () { item.blur(); }, 0);
      return;
    }

    if (!e.target.closest('.nav-item-wrap')) {
      fecharDesktop(null);
      var ativo = document.activeElement;
      if (ativo && ativo.closest && ativo.closest('.navbar-main .nav-item-wrap')) ativo.blur();
    }
  });

  document.addEventListener('mouseover', function (e) {
    var wrap = e.target.closest('.navbar-main .nav-item-wrap');
    if (!wrap || (e.relatedTarget && wrap.contains(e.relatedTarget))) return;
    fecharDesktop(wrap);
    var ativo = document.activeElement;
    if (ativo && ativo.closest && ativo.closest('.nav-item-wrap') && !wrap.contains(ativo)) ativo.blur();
    alinhar(wrap);
  });

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    fecharDesktop(null);
    var ativo = document.activeElement;
    if (ativo && ativo.closest && ativo.closest('.nav-item-wrap')) ativo.blur();
  });

  document.addEventListener('DOMContentLoaded', function () {
    if (typeof window.closeMobileNav !== 'function' || window.closeMobileNav.__adiado) return;
    var imediato = window.closeMobileNav;
    function adiado() { setTimeout(imediato, 0); }
    adiado.__adiado = true;
    window.closeMobileNav = adiado;
  });
})();
</script>
